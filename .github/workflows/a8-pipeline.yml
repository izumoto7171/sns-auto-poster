name: A8新着案件パイプライン

on:
  schedule:
    # JST 7:00（UTC 22:00）— 朝一番に新着案件を取得して記事化
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto          # 新着案件パイプライン
          - ranking       # ランキング記事（次のジャンル自動選択）
          - ranking_vod   # VODランキング
          - ranking_eikaiwa
          - ranking_programming
          - ranking_credit_card
          - ranking_fx
          - ranking_denryoku
          - dry_run       # テスト実行（投稿なし）

permissions:
  contents: write

jobs:
  # ===========================================================
  # 新着A8案件 → 記事生成 → はてな投稿
  # ===========================================================
  a8-new-program:
    name: A8新着案件 記事生成
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.mode == 'auto' || github.event.inputs.mode == '' || github.event_name == 'schedule' }}

    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install google-genai requests beautifulsoup4 duckduckgo_search

      - name: Gemini JSONキャッシュ復元
        uses: actions/cache@v5
        with:
          path: money_agent/gemini_cache.json
          key: ${{ runner.os }}-gemini-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gemini-cache-

      - name: A8新着案件パイプライン実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "dry_run" ]; then
            python3 money_agent/a8_new_program_pipeline.py dry-run
          else
            python3 money_agent/a8_new_program_pipeline.py
          fi

      - name: 処理済みリストをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add money_agent/seen_a8_programs.json || true
          git diff --staged --quiet || git commit -m "chore: A8新着案件パイプライン実行 $(date +'%Y-%m-%d')"
          git pull --rebase origin main && git push || true

  # ===========================================================
  # 承認済みプログラム → 記事生成 → はてな投稿
  # a8-new-program の後に実行（Gemini クォータ競合を避けるため）
  # seen_a8_programs.json で管理 → 全件処理済みなら何もしない
  # ===========================================================
  approved-programs:
    name: 承認済みプログラム記事生成
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: a8-new-program
    if: |
      always() &&
      (github.event.inputs.mode == 'auto' || github.event.inputs.mode == '' || github.event_name == 'schedule')

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # a8-new-program のコミット後の最新を取得

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install google-genai requests beautifulsoup4

      - name: Gemini JSONキャッシュ復元
        uses: actions/cache@v5
        with:
          path: money_agent/gemini_cache.json
          key: ${{ runner.os }}-gemini-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gemini-cache-

      - name: 承認済みプログラム記事生成・投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          A8_MEDIA_ID: ${{ secrets.A8_MEDIA_ID }}
          A8_PASSWORD: ${{ secrets.A8_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 money_agent/a8_approved_auto.py

      - name: 処理済みリストをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add money_agent/seen_a8_approved.json \
                  money_agent/a8_programs_cache.json \
                  money_agent/a8_programs_history.json || true
          git diff --staged --quiet || git commit -m "chore: A8承認済みプログラム記事投稿 $(date +'%Y-%m-%d')"
          git pull --rebase origin main && git push || true

  # ===========================================================
  # ランキング記事生成（週2回：火・金 JST 10:00）
  # ===========================================================
  ranking-article:
    name: ランキング記事生成
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event.inputs.mode == 'ranking' ||
      startsWith(github.event.inputs.mode, 'ranking_') ||
      (github.event_name == 'schedule' && (github.run_attempt == 1))

    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install google-genai requests

      - name: ランキング記事生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [[ "$MODE" == ranking_* ]]; then
            GENRE="${MODE#ranking_}"
            python3 money_agent/ranking_article_generator.py "$GENRE"
          elif [ "$MODE" = "dry_run" ]; then
            python3 money_agent/ranking_article_generator.py auto dry-run
          else
            python3 money_agent/ranking_article_generator.py auto
          fi

      - name: 生成済みリストをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add money_agent/ranking_generated.json || true
          git diff --staged --quiet || git commit -m "chore: ランキング記事生成 $(date +'%Y-%m-%d')"
          git pull --rebase origin main && git push || true

  # ===========================================================
  # A8レポート集計（月1回：毎月1日 JST 9:00）
  # ===========================================================
  a8-report:
    name: A8収益レポート集計
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 毎月1日のみ実行（scheduleは毎日なので日付チェック）
    if: |
      github.event.inputs.mode == 'report' ||
      (github.event_name == 'schedule' && startsWith(github.event.inputs.mode, 'report'))

    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install requests

      - name: A8レポート集計
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: "993"
          IMAP_USER: ${{ secrets.GMAIL_USER }}
          IMAP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 money_agent/a8_report_collector.py collect

      - name: レポートをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add money_agent/a8_report.json money_agent/a8_report.csv || true
          git diff --staged --quiet || git commit -m "chore: A8収益レポート更新 $(date +'%Y-%m')"
          git pull --rebase origin main && git push || true
