name: SNS Auto Post

on:
  schedule:
    # Amazon商品データ更新（JST 5:00 = UTC 20:00）※投稿より先に実行
    - cron: '0 20 * * *'   # JST 5:00 → 商品ローテーション
    # X/Bluesky/はてな/note 投稿（JST 7/11/15/19/23時）
    - cron: '0 22 * * *'   # JST 7:00
    - cron: '0 2 * * *'    # JST 11:00
    - cron: '0 6 * * *'    # JST 15:00
    - cron: '0 10 * * *'   # JST 19:00
    - cron: '0 14 * * *'   # JST 23:00
    # ショート動画コンテンツ投稿（JST 7:45/11:45/15:45/19:45/23:45 = +45分ずらして衝突回避）
    - cron: '45 22 * * *'  # JST 7:45
    - cron: '45 2 * * *'   # JST 11:45
    - cron: '45 6 * * *'   # JST 15:45
    - cron: '45 10 * * *'  # JST 19:45
    - cron: '45 14 * * *'  # JST 23:45
  workflow_dispatch:        # 手動実行ボタン

jobs:
  # ============================================================
  # 🔄 Amazon商品データ自動ローテーション（JST 5:00 に実行）
  # ============================================================
  update-amazon-products:
    name: 🔄 Amazon商品データ更新
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 20 * * *'
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install google-genai requests

      - name: Amazon商品データ更新
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
        run: |
          cd x_automation
          python3 product_rotator.py

      - name: 更新データをコミット & プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add x_automation/amazon_deals.json \
                  x_automation/product_history.json \
                  x_automation/static_products.json || true
          git diff --staged --quiet || \
            git commit -m "chore: Amazon商品データ自動更新 $(date +'%Y-%m-%d')"
          git push || true

  post-x:
    name: X (Twitter) 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # JST 5:00（商品データ更新）とtiktok専用cronでは実行しない
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       github.event.schedule != '0 20 * * *' &&
       github.event.schedule != '45 22 * * *' &&
       github.event.schedule != '45 2 * * *' &&
       github.event.schedule != '45 6 * * *' &&
       github.event.schedule != '45 10 * * *' &&
       github.event.schedule != '45 14 * * *')
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 日本語フォントインストール（画像カード用）
        run: sudo apt-get install -y fonts-noto-cjk

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv tweepy "twikit==1.7.4" Pillow playwright

      - name: Playwright Chromiumインストール
        run: playwright install chromium --with-deps

      - name: X投稿（tweepy → twikit → browser フォールバック）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_BROWSER_COOKIES: ${{ secrets.X_BROWSER_COOKIES }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd x_automation
          python3 x_poster.py live

  post-bluesky:
    name: Bluesky 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       github.event.schedule != '0 20 * * *' &&
       github.event.schedule != '45 22 * * *' &&
       github.event.schedule != '45 2 * * *' &&
       github.event.schedule != '45 6 * * *' &&
       github.event.schedule != '45 10 * * *' &&
       github.event.schedule != '45 14 * * *')
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install atproto google-genai python-dotenv

      - name: Bluesky投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          cd bluesky_automation
          python3 bsky_poster.py live

  post-hatena:
    name: はてなブログ 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       github.event.schedule != '0 20 * * *' &&
       github.event.schedule != '45 22 * * *' &&
       github.event.schedule != '45 2 * * *' &&
       github.event.schedule != '45 6 * * *' &&
       github.event.schedule != '45 10 * * *' &&
       github.event.schedule != '45 14 * * *')
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv playwright

      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromiumインストール（キャッシュミス時のみ）
        run: playwright install chromium --with-deps

      - name: はてなブログ投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HATENA_COOKIES: ${{ secrets.HATENA_COOKIES }}
        run: |
          cd hatena_automation
          python3 hatena_poster.py post

  post-note:
    name: note 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       github.event.schedule != '0 20 * * *' &&
       github.event.schedule != '45 22 * * *' &&
       github.event.schedule != '45 2 * * *' &&
       github.event.schedule != '45 6 * * *' &&
       github.event.schedule != '45 10 * * *' &&
       github.event.schedule != '45 14 * * *')
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv playwright

      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromiumインストール（キャッシュミス時のみ）
        run: playwright install chromium --with-deps

      - name: note投稿
        env:
          CI: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTE_COOKIES: ${{ secrets.NOTE_COOKIES }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd note_automation
          python3 note_poster.py post

      - name: デバッグスクリーンショットをアップロード（失敗時）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-debug-screenshot
          path: note_automation/note_debug.png
          if-no-files-found: ignore
          retention-days: 3

  # ============================================================
  # 🛍️ 楽天ルーム 自動投稿（一人暮らし20代男性 × 女性ウケ商品ガチレビュー）
  # ============================================================
  post-rakuten-room:
    name: 🛍️ 楽天ルーム投稿
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # JST 12:00（UTC 3:00）のみ実行（1日1商品）
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install google-genai python-dotenv playwright requests

      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromiumインストール（キャッシュミス時のみ）
        run: playwright install chromium --with-deps

      - name: 楽天ルーム投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_EMAIL: ${{ secrets.RAKUTEN_EMAIL }}
          RAKUTEN_PASSWORD: ${{ secrets.RAKUTEN_PASSWORD }}
        run: |
          python3 -m rakuten_room.main --count 1

      - name: 投稿ログをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rakuten_room/post_log.json || true
          git diff --staged --quiet || git commit -m "chore: 楽天ルーム投稿ログ更新 $(date +'%Y-%m-%d')"
          git push || true

  # ============================================================
  # 🎬 ショート動画コンテンツ生成（X + Bluesky に投稿）
  # ============================================================
  tiktok-content:
    name: 🎬 ショート動画コンテンツ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # JST 7:45/11:45/15:45/19:45/23:45 専用（post-xと45分ずらして衝突回避）
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '45 22 * * *' ||
      github.event.schedule == '45 2 * * *' ||
      github.event.schedule == '45 6 * * *' ||
      github.event.schedule == '45 10 * * *' ||
      github.event.schedule == '45 14 * * *'
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv atproto "twikit==1.7.4" gtts
          sudo apt-get install -y ffmpeg

      - name: ショート動画コンテンツ投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
        run: |
          python3 tiktok_automation/tiktok_poster.py live
