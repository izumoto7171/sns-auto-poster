name: SNS Auto Post

on:
  schedule:
    # 毎日 7/11/15/19/23時（JST = UTC+9）× 5投稿/日
    - cron: '0 22 * * *'   # JST 7:00
    - cron: '0 2 * * *'    # JST 11:00
    - cron: '0 6 * * *'    # JST 15:00
    - cron: '0 10 * * *'   # JST 19:00
    - cron: '0 14 * * *'   # JST 23:00
  workflow_dispatch:        # 手動実行ボタン

jobs:
  post-x:
    name: X (Twitter) 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 日本語フォントインストール（画像カード用）
        run: sudo apt-get install -y fonts-noto-cjk

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv tweepy "twikit==1.7.4" Pillow playwright

      - name: Playwright Chromiumインストール
        run: playwright install chromium --with-deps

      - name: X投稿（tweepy → twikit → browser フォールバック）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_BROWSER_COOKIES: ${{ secrets.X_BROWSER_COOKIES }}
        run: |
          cd x_automation
          python3 x_poster.py live

  post-bluesky:
    name: Bluesky 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install atproto google-genai python-dotenv

      - name: Bluesky投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          cd bluesky_automation
          python3 bsky_poster.py live

  post-hatena:
    name: はてなブログ 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv playwright

      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromiumインストール（キャッシュミス時のみ）
        run: playwright install chromium --with-deps

      - name: はてなブログ投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HATENA_COOKIES: ${{ secrets.HATENA_COOKIES }}
        run: |
          cd hatena_automation
          python3 hatena_poster.py post

  post-note:
    name: note 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv playwright

      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromiumインストール（キャッシュミス時のみ）
        run: playwright install chromium --with-deps

      - name: note投稿
        env:
          CI: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTE_COOKIES: ${{ secrets.NOTE_COOKIES }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd note_automation
          python3 note_poster.py post

      - name: デバッグスクリーンショットをアップロード（失敗時）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-debug-screenshot
          path: note_automation/note_debug.png
          if-no-files-found: ignore
          retention-days: 3

  # ============================================================
  # 🛍️ 楽天ルーム 自動投稿（一人暮らし20代男性 × 女性ウケ商品ガチレビュー）
  # ============================================================
  post-rakuten-room:
    name: 🛍️ 楽天ルーム投稿
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # JST 12:00（UTC 3:00）のみ実行（1日1商品）
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install google-genai python-dotenv playwright requests

      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromiumインストール（キャッシュミス時のみ）
        run: playwright install chromium --with-deps

      - name: 楽天ルーム投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_EMAIL: ${{ secrets.RAKUTEN_EMAIL }}
          RAKUTEN_PASSWORD: ${{ secrets.RAKUTEN_PASSWORD }}
        run: |
          python3 -m rakuten_room.main --count 1

      - name: 投稿ログをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rakuten_room/post_log.json || true
          git diff --staged --quiet || git commit -m "chore: 楽天ルーム投稿ログ更新 $(date +'%Y-%m-%d')"
          git push || true

  # ============================================================
  # 🎬 ショート動画コンテンツ生成（X + Bluesky に投稿）
  # ============================================================
  tiktok-content:
    name: 🎬 ショート動画コンテンツ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv atproto "twikit==1.7.4" gtts
          sudo apt-get install -y ffmpeg

      - name: ショート動画コンテンツ投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
        run: |
          python3 tiktok_automation/tiktok_poster.py live
