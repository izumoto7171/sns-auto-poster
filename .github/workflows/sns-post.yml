name: SNS Auto Post

on:
  schedule:
    - cron: '0 23 * * *'   # JST 8:00  ← 朝ピーク
    - cron: '0 13 * * *'   # JST 22:00 ← 夜の余暇時間
  workflow_dispatch:        # 手動実行ボタン

jobs:
  # ============================================================
  # 🔄 Amazon商品データ自動ローテーション（JST 5:00 に実行）
  # ============================================================
  update-amazon-products:
    name: 🔄 Amazon商品データ更新
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install google-genai requests

      - name: Amazon商品データ更新
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
        run: |
          cd x_automation
          python3 product_rotator.py

      - name: 更新データをコミット & プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add x_automation/amazon_deals.json \
                  x_automation/product_history.json \
                  x_automation/static_products.json || true
          git diff --staged --quiet || \
            git commit -m "chore: Amazon商品データ自動更新 $(date +'%Y-%m-%d')"
          git push || true

  # ============================================================
  # 📈 トレンドリズナー（トレンドKW → 商品選別 → pending_tasks 投入）
  # update-amazon-products と並列で実行（独立ジョブ）
  # ============================================================
  run-trend-reasoner:
    name: 📈 トレンド商品選別
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install requests supabase pytrends

      - name: トレンド商品選別 → pending_tasks 投入（アフィリ + x_info）
        env:
          RAKUTEN_APP_ID:       ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY:   ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ORIGIN:       ${{ secrets.RAKUTEN_ORIGIN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 -m crawlers.trend_reasoner --top 3 --post-type x
          python3 -m crawlers.trend_reasoner --top 3 --post-type x_info

  # ============================================================
  # 🤖 バッチプロセッサ（キュー → Gemini 一括生成 → content_cache）
  # trend_reasoner と update-amazon-products が終わってから実行
  # ============================================================
  run-batch-processor:
    name: 🤖 バッチ生成（Gemini 一括）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [update-amazon-products, run-trend-reasoner]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule'
      )
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install google-genai supabase

      - name: キュー処理（最大8件を1回のGeminiコールで生成）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 batch_processor.py --post-type x

  post-x:
    name: X (Twitter) 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    needs: [update-amazon-products, run-batch-processor]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule'
      )
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 日本語フォントインストール（画像カード用）
        run: sudo apt-get install -y fonts-noto-cjk

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv tweepy "twikit==1.7.4" Pillow playwright supabase

      - name: Playwright Chromiumインストール
        run: playwright install chromium --with-deps

      - name: X投稿（tweepy → twikit → browser フォールバック）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_BROWSER_COOKIES: ${{ secrets.X_BROWSER_COOKIES }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: |
          cd x_automation
          python3 x_poster.py live

      - name: 有益ツイート投稿（x_info タイプ・アフィリリンクなし）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd x_automation
          python3 x_poster.py live --type x_info

      - name: クールダウン履歴をコミット & プッシュ
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            x_automation/product_history.json \
            x_automation/rakuten_post_history.json \
            x_automation/post_log.json \
            data/product_history.json \
            money_agent/a8_programs_history.json \
            money_agent/a8_programs_cache.json || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: X投稿ログ更新 $(date +'%Y-%m-%d %H:%M')"
          # 他のジョブが先にpushしていた場合はrebaseしてretry
          git pull --rebase origin main && git push || \
          git pull --rebase origin main && git push

  post-bluesky:
    name: Bluesky 投稿（一時停止中）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: false  # 一時停止
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install atproto google-genai python-dotenv

      - name: Bluesky投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          cd bluesky_automation
          python3 bsky_poster.py live

  post-hatena:
    name: はてなブログ 投稿（一時停止中）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: false  # 一時停止
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv playwright

      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromiumインストール（キャッシュミス時のみ）
        run: playwright install chromium --with-deps

      - name: はてなブログ投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_COOKIES: ${{ secrets.HATENA_COOKIES }}
        run: |
          cd hatena_automation
          python3 hatena_poster.py post

  post-note:
    name: note 投稿（一時停止中）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: false  # 一時停止
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv playwright

      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromiumインストール（キャッシュミス時のみ）
        run: playwright install chromium --with-deps

      - name: note投稿
        env:
          CI: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTE_COOKIES: ${{ secrets.NOTE_COOKIES }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd note_automation
          python3 note_poster.py post

      - name: デバッグスクリーンショットをアップロード（失敗時）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-debug-screenshot
          path: note_automation/note_debug.png
          if-no-files-found: ignore
          retention-days: 3

  # ============================================================
  # 🛍️ 楽天ルーム 自動投稿（一人暮らし20代男性 × 女性ウケ商品ガチレビュー）
  # ============================================================
  post-rakuten-room:
    name: 🛍️ 楽天ルーム投稿
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # JST 12:00（UTC 3:00）のみ実行（1日1商品）
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install google-genai python-dotenv playwright requests

      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromiumインストール（キャッシュミス時のみ）
        run: playwright install chromium --with-deps

      - name: 楽天ルーム投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_EMAIL: ${{ secrets.RAKUTEN_EMAIL }}
          RAKUTEN_PASSWORD: ${{ secrets.RAKUTEN_PASSWORD }}
        run: |
          python3 -m rakuten_room.main --count 1

      - name: 投稿ログをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rakuten_room/post_log.json || true
          git diff --staged --quiet || git commit -m "chore: 楽天ルーム投稿ログ更新 $(date +'%Y-%m-%d')"
          git push || true
