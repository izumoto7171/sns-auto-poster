name: SNS Auto Post

on:
  schedule:
    # 毎日 7/11/15/19/23時（JST = UTC+9）× 5投稿/日
    - cron: '0 22 * * *'   # JST 7:00
    - cron: '0 2 * * *'    # JST 11:00
    - cron: '0 6 * * *'    # JST 15:00
    - cron: '0 10 * * *'   # JST 19:00
    - cron: '0 14 * * *'   # JST 23:00
    # 雑学ショート追加スロット（JST 9/13/17/21時）× 4本/日
    - cron: '0 0 * * *'    # JST 9:00
    - cron: '0 4 * * *'    # JST 13:00
    - cron: '0 8 * * *'    # JST 17:00
    - cron: '0 12 * * *'   # JST 21:00
  workflow_dispatch:        # 手動実行ボタン

jobs:
  post-x:
    name: X (Twitter) 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv tweepy "twikit==1.7.4"

      - name: X投稿（tweepy公式API）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: |
          cd x_automation
          python3 x_poster.py live

  post-bluesky:
    name: Bluesky 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install atproto google-genai python-dotenv

      - name: Bluesky投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          cd bluesky_automation
          python3 bsky_poster.py live

  post-hatena:
    name: はてなブログ 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv playwright

      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromiumインストール（キャッシュミス時のみ）
        run: playwright install chromium --with-deps

      - name: はてなブログ投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HATENA_COOKIES: ${{ secrets.HATENA_COOKIES }}
        run: |
          cd hatena_automation
          python3 hatena_poster.py post

  post-note:
    name: note 投稿
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv playwright

      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromiumインストール（キャッシュミス時のみ）
        run: playwright install chromium --with-deps

      - name: note投稿
        env:
          CI: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTE_COOKIES: ${{ secrets.NOTE_COOKIES }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd note_automation
          python3 note_poster.py post

      - name: デバッグスクリーンショットをアップロード（失敗時）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-debug-screenshot
          path: note_automation/note_debug.png
          if-no-files-found: ignore
          retention-days: 3

  # ============================================================
  # 💰 月10万円 AIエージェント（SEO記事 × アフィリエイト）
  # ============================================================
  money-agent:
    name: 💰 月10万円エージェント
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 全スケジュール（8/12/18/22時）で実行 = 1日4回
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv playwright atproto tweepy

      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromiumインストール（キャッシュミス時のみ）
        run: playwright install chromium --with-deps

      - name: 月10万円エージェント実行
        env:
          CI: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HATENA_COOKIES: ${{ secrets.HATENA_COOKIES }}
          NOTE_COOKIES: ${{ secrets.NOTE_COOKIES }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python3 money_agent/money_agent.py run

  # ============================================================
  # 📡 トレンドデータ収集（毎日JST 7:00 = UTC 22:00のみ実行）
  # ============================================================
  collect-trends:
    name: 📡 トレンド収集
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # JST 7:00（UTC 22:00）のスケジュールでのみ実行
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * *'
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install google-genai python-dotenv requests

      - name: トレンドデータ収集
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 money_agent/data_collector.py collect

      - name: 収集結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add money_agent/dynamic_keywords.json || true
          git diff --staged --quiet || git commit -m "chore: トレンドキーワード自動更新 $(date +'%Y-%m-%d')"
          git push || true

  # ============================================================
  # 🎬 ショート動画コンテンツ生成（X + Bluesky に投稿）
  # ============================================================
  tiktok-content:
    name: 🎬 ショート動画コンテンツ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai python-dotenv atproto "twikit==1.7.4" gtts
          sudo apt-get install -y ffmpeg

      - name: ショート動画コンテンツ投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
        run: |
          python3 tiktok_automation/tiktok_poster.py live

  # ============================================================
  # 🧠 AI雑学ショート自動生成（X + Bluesky 投稿 + 動画コミット）
  # JST 9/13/17/21時 の4スロットで実行 = 1日4本
  # ============================================================
  trivia-shorts:
    name: 🧠 AI雑学ショート
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 雑学専用スロットのみ実行（他のスロットはスキップ）
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 0 * * *'  ||
      github.event.schedule == '0 4 * * *'  ||
      github.event.schedule == '0 8 * * *'  ||
      github.event.schedule == '0 12 * * *'
    steps:
      - uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install pillow google-genai anthropic python-dotenv atproto "twikit==1.7.4" \
            google-api-python-client google-auth-oauthlib google-auth-httplib2
          sudo apt-get install -y ffmpeg

      - name: 日本語フォントインストール
        run: |
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: YouTube OAuthトークンを復元
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          if [ -n "$YOUTUBE_TOKEN" ]; then
            echo "$YOUTUBE_TOKEN" | base64 -d > youtube_automation/token.pickle
            echo "✅ token.pickle 復元完了"
          else
            echo "⚠️ YOUTUBE_TOKEN シークレット未設定（YouTube投稿スキップ）"
          fi

      - name: AI雑学ショート生成・YouTube投稿
        env:
          CI: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          python3 trivia_pipeline.py live 1

      - name: 生成動画をアーティファクトに保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivia-video-${{ github.run_number }}
          path: output/trivia/*.mp4
          if-no-files-found: ignore
          retention-days: 7
