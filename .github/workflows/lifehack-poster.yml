name: Lifestyle Hack Auto Poster

on:
  schedule:
    - cron: '0 23 * * *'   # 毎日 JST 8:00
    - cron: '0 13 * * *'   # 毎日 JST 22:00
  workflow_dispatch:

jobs:
  post-to-x:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow google-genai tweepy requests

      - name: Run Lifehack Poster
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_USERNAME:            ${{ secrets.X_USERNAME }}
        run: |
          cd x_automation
          python3 lifehack_poster.py
