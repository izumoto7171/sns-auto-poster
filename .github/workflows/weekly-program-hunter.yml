name: 週次アフィリエイト案件リサーチ

on:
  schedule:
    # 毎週月曜 JST 9:00 (UTC 0:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:   # 手動実行ボタン

jobs:
  hunt-programs:
    name: トレンド案件リサーチ & ポートフォリオ更新
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: |
          pip install google-genai requests pytrends playwright
          playwright install chromium --with-deps

      - name: 週次トレンドリサーチ実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          python3 crawlers/weekly_trend_hunter.py

      - name: A8高単価プログラム自動検索 & 提携申請
        continue-on-error: true
        env:
          A8_MEDIA_ID: ${{ secrets.A8_MEDIA_ID }}
          A8_PASSWORD: ${{ secrets.A8_PASSWORD }}
        run: |
          python3 money_agent/a8_auto_apply.py --discover --count 5 \
            || echo "[A8自動申請] エラー（続行）"

      - name: GitHub Actions使用量チェック
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/actions_usage_monitor.py \
            || echo "[使用量チェック] エラー（続行）"

      - name: 結果を JSON にコミット & プッシュ
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            money_agent/data/program_portfolio.json \
            money_agent/a8_programs_cache.json \
            money_agent/a8_programs_history.json \
            x_automation/weekly_amazon_keywords.json \
            x_automation/weekly_rakuten_keywords.json || true
          git diff --staged --quiet || \
            git commit -m "chore: 週次案件リサーチ + A8自動申請更新 $(date +'%Y-%m-%d')"
          git push || true
